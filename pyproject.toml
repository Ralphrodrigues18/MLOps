[project]
name = "mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ralphrodrigues18", email = "ralpbrodrigues@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "joblib>=1.6.0",
    "logger>=1.4",
    "loguru>=0.7.3",
    "pandas>=3.1.1",
    "path>=17.1.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
mlops = "mlops:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
